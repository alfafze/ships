<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a shipment with alfaships.">
  <title>Send a shipment — alfaships</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="standard.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body class="standard-page">
  <header class="standard-header"><div class="standard-header__inner"><a class="standard-brand" href="index.html">ships<span>.</span></a><a class="standard-header__link" href="pages.html">All pages</a></div></header>
  <main class="standard-main">
    <section class="standard-hero"><p class="standard-kicker">Send a shipment</p><h1>Create a label without the busywork.</h1><p>Enter the shipment details below. The form is ready for a backend endpoint and validates the required delivery information.</p></section>
    <section class="sending-app standard-card" aria-labelledby="sending-title">
      <div class="sending-app__header"><div><p class="standard-kicker">New shipment</p><h2 id="sending-title">Shipment details</h2></div><span class="tracking-status">Secure form</span></div>
      <form id="sending-form" class="sending-form">
        <div><label for="sender-name">Sender name</label><input id="sender-name" name="senderName" autocomplete="name" required></div>
        <div><label for="sender-email">Sender email</label><input id="sender-email" name="senderEmail" type="email" autocomplete="email" required></div>
        <div><label for="origin">From</label><input id="origin" name="origin" placeholder="New York, NY" required></div>
        <div><label for="destination">To</label><input id="destination" name="destination" placeholder="Chicago, IL" required></div>
        <div><label for="weight">Package weight</label><input id="weight" name="weight" type="number" min="0.1" step="0.1" placeholder="2.5" required></div>
        <div><label for="service">Service</label><select id="service" name="service"><option value="standard">Standard</option><option value="express">Express</option><option value="overnight">Overnight</option></select></div>
        <div class="field-full"><label for="notes">Delivery notes <span>(optional)</span></label><textarea id="notes" name="notes" placeholder="Gate code, delivery preferences, or handling instructions"></textarea></div>
        <div class="sending-form__actions"><button type="submit">Create shipment <span aria-hidden="true">→</span></button><small id="sending-help">Your shipment will be created after confirmation.</small></div>
      </form>
      <div id="sending-result" class="sending-result" role="status" aria-live="polite" hidden></div>
    </section>
  </main>
  <script src="send.js"></script>
</body>
</html>
