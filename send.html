<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Create a shipment with alfaships."><title>Send a shipment — alfaships</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="standard.css"><link rel="stylesheet" href="forms.css"><link rel="stylesheet" href="mobile.css"></head>
<body class="standard-page"><header class="standard-header"><div class="standard-header__inner"><a class="standard-brand" href="index.html">ships<span>.</span></a><nav class="standard-header__nav"><a class="standard-header__link" href="dashboard.html">Dashboard</a><a class="standard-header__link" href="track.html">Track</a><a class="standard-header__link" href="pages.html">All pages</a></nav></div></header><main class="standard-main"><section class="standard-hero"><p class="standard-kicker">Send a shipment</p><h1>Create a label without the busywork.</h1><p>Enter the shipment details below and create a tracking record.</p></section><section class="sending-app standard-card"><div class="sending-app__header"><div><p class="standard-kicker">New shipment</p><h2>Shipment details</h2></div><span class="status-pill">Secure form</span></div><form id="sending-form" class="form-grid" data-validate><div class="form-field"><label for="sender-name">Sender name</label><input id="sender-name" name="senderName" autocomplete="name" required><small data-error></small></div><div class="form-field"><label for="sender-email">Sender email</label><input id="sender-email" name="senderEmail" type="email" autocomplete="email" required><small data-error></small></div><div class="form-field"><label for="origin">From</label><input id="origin" name="origin" placeholder="New York, NY" required><small data-error></small></div><div class="form-field"><label for="destination">To</label><input id="destination" name="destination" placeholder="Chicago, IL" required><small data-error></small></div><div class="form-field"><label for="weight">Package weight</label><input id="weight" name="weight" type="number" min="0.1" step="0.1" required><small data-error></small></div><div class="form-field"><label for="service">Service</label><select id="service" name="service"><option value="standard">Standard</option><option value="express">Express</option><option value="overnight">Overnight</option></select><small data-error></small></div><div class="form-field form-field--full"><label for="notes">Delivery notes <span>(optional)</span></label><textarea id="notes" name="notes"></textarea><small data-error></small></div><div class="form-actions"><button class="form-button" type="submit">Create shipment</button></div></form><div id="sending-result" class="form-result" role="status" aria-live="polite"></div></section></main><script src="app.js"></script></body></html>
