<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Contact the Ships team."><title>Contact Ships</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><nav class="nav container"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-location-arrow"></i></span>ships<span class="brand-dot">.</span></a><a class="button button-small" href="index.html">Back home</a></nav></header><main class="contact-page"><div class="container contact-layout"><div class="section-heading reveal is-visible"><p class="eyebrow"><span></span> Talk to Ships</p><h1>Let’s make your<br><em>next shipment easier.</em></h1><p>Tell us about your operation, your customers, or the workflow you want to improve. We reply within one business day.</p><div class="contact-detail"><i class="fa-solid fa-envelope"></i><span>hello@ships.example</span></div><div class="contact-detail"><i class="fa-solid fa-clock"></i><span>Monday–Friday · 9am–6pm</span></div></div><form class="contact-form reveal is-visible" id="standalone-contact" novalidate><div class="field"><label for="full-name">Full name</label><input id="full-name" required minlength="2"><small class="error" data-error-for="full-name"></small></div><div class="field"><label for="work-email">Work email</label><input id="work-email" type="email" required><small class="error" data-error-for="work-email"></small></div><div class="field full"><label for="company">Company</label><input id="company" required><small class="error" data-error-for="company"></small></div><div class="field full"><label for="message">Message</label><textarea id="message" rows="6" required minlength="20" placeholder="Tell us what you are building..."></textarea><small class="error" data-error-for="message"></small></div><button class="button" type="submit">Send inquiry <i class="fa-solid fa-paper-plane"></i></button><p class="form-message" id="standalone-result" role="status" aria-live="polite"></p></form></div></main><script src="script.js"></script><script>document.querySelector('#standalone-contact').addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget,o=document.querySelector('#standalone-result');if(!validate(f)){o.textContent='Please review the highlighted fields.';return}o.textContent='Thanks — your inquiry is ready to be sent.';f.reset()})</script></body></html>
