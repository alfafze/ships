<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Track a Ships package in real time."><title>Track a package — Ships</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><nav class="nav container"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-location-arrow"></i></span>ships<span class="brand-dot">.</span></a><a class="button button-small" href="index.html">Back home</a></nav></header><main class="track-page"><div class="container track-layout"><div class="section-heading reveal is-visible"><p class="eyebrow"><span></span> Shipment intelligence</p><h1>Know exactly<br><em>where it is.</em></h1><p>Enter a tracking number to view the latest shipment milestone. Try <strong>SH-2048-AL</strong>.</p></div><section class="tracking-panel reveal is-visible"><form id="track-page-form"><label for="track-page-number">Tracking number</label><div class="track-input"><input id="track-page-number" required placeholder="SH-2048-AL"><button class="button" type="submit">Track <i class="fa-solid fa-arrow-right"></i></button></div></form><div id="track-page-result" class="track-result" role="status" aria-live="polite"></div><div class="track-timeline"><div class="timeline-item done"><i class="fa-solid fa-check"></i><div><b>Package picked up</b><small>New York · Today, 08:42</small></div></div><div class="timeline-item done"><i class="fa-solid fa-location-dot"></i><div><b>In transit</b><small>Moving to destination</small></div></div><div class="timeline-item"><i class="fa-solid fa-house"></i><div><b>Out for delivery</b><small>Estimated tomorrow</small></div></div></div></section></div></main><script src="script.js"></script><script>document.querySelector('#track-page-form').addEventListener('submit',e=>{e.preventDefault();const n=document.querySelector('#track-page-number').value.trim();document.querySelector('#track-page-result').innerHTML=n?`Shipment <strong>${n}</strong> is <strong>in transit</strong>. Last scanned 12 minutes ago.`:'Enter a tracking number.'})</script></body></html>
